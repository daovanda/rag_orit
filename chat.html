<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zilcode AI Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f3;
    height: 100vh;
    display: flex;
    flex-direction: column;
    color: #1a1a1a;
  }

  header {
    background: #fff;
    border-bottom: 0.5px solid #e0e0dc;
    padding: 14px 20px;
    display: flex;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 10px;
  }

  header .logo {
    width: 32px; height: 32px;
    background: #1a1a1a;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-weight: 600;
    font-size: 14px;
  }

  header h1 { font-size: 15px; font-weight: 500; }
  header span { font-size: 13px; color: #888; margin-left: 4px; }

  .worker-url {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .worker-url input {
    font-size: 12px;
    border: 0.5px solid #ddd;
    border-radius: 6px;
    padding: 5px 10px;
    width: 300px;
    background: #fafaf8;
    color: #1a1a1a;
  }

  .auth-panel {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
    margin-left: 8px;
    min-width: 0;
  }

  .auth-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .auth-panel input,
  .auth-panel select {
    font-size: 12px;
    border: 0.5px solid #ddd;
    border-radius: 6px;
    padding: 5px 8px;
    width: 105px;
    background: #fafaf8;
    color: #1a1a1a;
  }

  .auth-panel input[type="password"] {
    width: 115px;
  }

  .auth-panel input#zilBase {
    width: 165px;
  }

  #authStatus {
    display: block;
    font-size: 12px;
    color: #666;
    margin-left: 0;
    max-width: 720px;
    overflow: visible;
    white-space: normal;
    line-height: 1.4;
  }

  .role-org-picker {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    padding: 6px;
    border: 0.5px solid #e0e0dc;
    border-radius: 8px;
    background: #fafaf8;
  }

  .role-org-picker[hidden] {
    display: none;
  }

  .role-org-picker select {
    width: 180px;
    background: #fff;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ccc;
    flex-shrink: 0;
  }
  .dot.online { background: #3d9e6e; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 720px;
    width: 100%;
  }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .bubble {
    background: #1a1a1a;
    color: #fff;
    border-radius: 12px 12px 2px 12px;
  }

  .msg.assistant .bubble {
    background: #fff;
    border: 0.5px solid #e0e0dc;
    border-radius: 2px 12px 12px 12px;
    color: #1a1a1a;
  }

  .tool-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    background: #f0f0ec;
    border: 0.5px solid #ddd;
    border-radius: 20px;
    padding: 3px 10px;
    color: #555;
    margin-bottom: 6px;
  }

  .tool-badge .icon {
    width: 14px; height: 14px;
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
  }

  .tool-badge.rag_search .icon { background: #dbeafe; color: #1d4ed8; }
  .tool-badge.general_chat .icon { background: #e5e7eb; color: #374151; }
  .tool-badge.draw_chart .icon { background: #fae8ff; color: #86198f; }
  .tool-badge.zilcode_app_builder_blueprint .icon { background: #dcfce7; color: #166534; }
  .tool-badge.app_builder_validate .icon { background: #fef9c3; color: #854d0e; }
  .tool-badge.app_builder_write .icon { background: #fee2e2; color: #991b1b; }

  .tool-badge .spinner {
    width: 10px; height: 10px;
    border: 1.5px solid #aaa;
    border-top-color: #555;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .typing {
    display: flex;
    gap: 4px;
    padding: 12px 14px;
    background: #fff;
    border: 0.5px solid #e0e0dc;
    border-radius: 2px 12px 12px 12px;
    width: fit-content;
  }

  .typing span {
    width: 7px; height: 7px;
    background: #aaa;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: #aaa;
  }

  .empty-state .big { font-size: 32px; }
  .empty-state p { font-size: 14px; }

  .suggestions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 8px;
  }

  .suggestion-btn {
    font-size: 12px;
    border: 0.5px solid #ddd;
    background: #fff;
    border-radius: 20px;
    padding: 6px 14px;
    cursor: pointer;
    color: #555;
    transition: all 0.15s;
  }

  .suggestion-btn:hover {
    background: #f0f0ec;
    border-color: #bbb;
    color: #1a1a1a;
  }

  .input-area {
    background: #fff;
    border-top: 0.5px solid #e0e0dc;
    padding: 14px 20px;
  }

  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    max-width: 760px;
    margin: 0 auto;
    background: #fafaf8;
    border: 0.5px solid #ddd;
    border-radius: 12px;
    padding: 10px 14px;
  }

  #userInput {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 14px;
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 120px;
    font-family: inherit;
    color: #1a1a1a;
  }

  #sendBtn {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: #1a1a1a;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }

  #sendBtn:hover { opacity: 0.8; }
  #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; }

  #sendBtn svg { width: 16px; height: 16px; fill: #fff; }

  .error-bubble {
    background: #fef2f2;
    border: 0.5px solid #fca5a5;
    color: #b91c1c;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
  }

  .generated-image {
    display: block;
    max-width: 100%;
    width: min(100%, 640px);
    border: 0.5px solid #e0e0dc;
    border-radius: 8px;
    background: #fff;
    margin-top: 8px;
  }

  .sources {
    margin-top: 8px;
    display: grid;
    gap: 6px;
    max-width: min(100%, 640px);
  }

  .source-item {
    border: 0.5px solid #e0e0dc;
    border-radius: 8px;
    background: #fbfbfa;
    padding: 8px 10px;
    font-size: 12px;
    color: #555;
  }

  .source-item strong {
    display: block;
    color: #1a1a1a;
    font-size: 12px;
    margin-bottom: 2px;
  }

  .source-meta {
    color: #888;
  }

  .debug-log {
    margin-top: 8px;
    max-width: min(100%, 640px);
    border: 0.5px solid #bfdbfe;
    border-radius: 8px;
    background: #eff6ff;
    color: #1e3a8a;
    padding: 7px 10px;
    font-size: 12px;
    line-height: 1.5;
  }

  .debug-log strong {
    color: #1d4ed8;
    font-weight: 600;
  }

  .debug-steps {
    margin-top: 8px;
    max-width: min(100%, 640px);
    border: 0.5px solid #d1d5db;
    border-radius: 8px;
    background: #f9fafb;
    color: #374151;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.5;
  }

  .debug-steps summary {
    cursor: pointer;
    font-weight: 600;
    color: #111827;
  }

  .debug-step {
    border-top: 0.5px solid #e5e7eb;
    padding-top: 7px;
    margin-top: 7px;
  }

  .debug-step-title {
    font-weight: 600;
    color: #111827;
  }

  .debug-step-data {
    margin-top: 4px;
    white-space: pre-wrap;
    word-break: break-word;
    color: #6b7280;
  }

  .timestamp {
    font-size: 11px;
    color: #bbb;
    margin-top: 4px;
    padding: 0 2px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">Z</div>
  <h1>Zilcode AI</h1>
  <span>RAG Chat</span>
  <div class="worker-url">
    <div class="dot" id="statusDot"></div>
    <input type="text" id="workerUrl" value="https://ragorit.daovanda2405.workers.dev" placeholder="Worker URL..." />
    <button class="suggestion-btn" onclick="checkHealth()">Ping</button>
  </div>
  <div class="auth-panel">
    <div class="auth-controls">
    <input type="text" id="zilBase" placeholder="Zilcode Base" value="https://demo.zilcode.com" autocomplete="url" />
    <input type="text" id="zilUsername" placeholder="Username" autocomplete="username" />
    <input type="text" id="zilSitecode" placeholder="SiteCode" autocomplete="organization" />
    <input type="password" id="zilPassword" placeholder="Password" autocomplete="current-password" />
    <button class="suggestion-btn" id="zilLoginBtn" onclick="loginZilcode()">Login</button>
    <button class="suggestion-btn" id="zilLogoutBtn" onclick="logoutZilcode()">Logout</button>
    </div>
    <span id="authStatus">Chưa đăng nhập Zilcode</span>
    <div id="roleOrgPicker" class="role-org-picker" hidden>
      <select id="zilRoleSelect" aria-label="Chọn role Zilcode"></select>
      <select id="zilOrgSelect" aria-label="Chọn organization Zilcode"></select>
      <button class="suggestion-btn" onclick="confirmRoleOrgSelection()">Dùng role/org</button>
    </div>
  </div>
</header>

<div id="messages">
  <div class="empty-state" id="emptyState">
    <div class="big">⚡</div>
    <p>Hỏi bất kỳ điều gì về Zilcode</p>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="send('Zilcode là gì?')">Zilcode là gì?</button>
      <button class="suggestion-btn" onclick="send('z-Flow hoạt động như thế nào?')">z-Flow hoạt động thế nào?</button>
      <button class="suggestion-btn" onclick="send('Tài khoản role system của tôi đang có những app, window, tab, bảng nào?')">System blueprint</button>
      <button class="suggestion-btn" onclick="send('Tính năng z-Admin gồm những gì?')">Tính năng z-Admin</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="userInput" rows="1" placeholder="Nhập câu hỏi..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="sendBtn" onclick="sendMessage()" title="Gửi">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
</div>

<script>
  const TOOL_META = {
    general_chat: { label: 'general_chat', icon: '💬', cls: 'general_chat' },
    rag_search: { label: 'rag_search', icon: '🔍', cls: 'rag_search' },
    draw_chart: { label: 'draw_chart', icon: '📊', cls: 'draw_chart' },
    zilcode_get_app_builder_blueprint: { label: 'AppBuilderBlueprint', icon: 'Z', cls: 'zilcode_app_builder_blueprint' },
    app_builder_validate_plan: { label: 'validate_plan', icon: '✓', cls: 'app_builder_validate' },
    app_builder_create_app: { label: 'create_app', icon: '+', cls: 'app_builder_write' },
    app_builder_update_app: { label: 'update_app', icon: '↻', cls: 'app_builder_write' },
    app_builder_create_table: { label: 'create_table', icon: '+', cls: 'app_builder_write' },
    app_builder_update_table: { label: 'update_table', icon: '↻', cls: 'app_builder_write' },
    app_builder_create_column: { label: 'create_column', icon: '+', cls: 'app_builder_write' },
    app_builder_update_column: { label: 'update_column', icon: '↻', cls: 'app_builder_write' },
    app_builder_create_window: { label: 'create_window', icon: '+', cls: 'app_builder_write' },
    app_builder_update_window: { label: 'update_window', icon: '↻', cls: 'app_builder_write' },
    app_builder_create_tab: { label: 'create_tab', icon: '+', cls: 'app_builder_write' },
    app_builder_update_tab: { label: 'update_tab', icon: '↻', cls: 'app_builder_write' },
    app_builder_create_field: { label: 'create_field', icon: '+', cls: 'app_builder_write' },
    app_builder_update_field: { label: 'update_field', icon: '↻', cls: 'app_builder_write' },
    app_builder_create_menu: { label: 'create_menu', icon: '+', cls: 'app_builder_write' },
    app_builder_update_menu: { label: 'update_menu', icon: '↻', cls: 'app_builder_write' },
    app_builder_create_domain: { label: 'create_domain', icon: '+', cls: 'app_builder_write' },
    app_builder_update_domain: { label: 'update_domain', icon: '↻', cls: 'app_builder_write' },
  };

  const CHAT_HISTORY_STORAGE_KEY = 'zilcode_chat_history_v1';
  const ZILCODE_SESSION_STORAGE_KEY = 'zilcode_api_session_v1';
  const MAX_HISTORY_MESSAGES = 6;
  const MAX_HISTORY_CONTENT_CHARS = 1200;
  const ROLE_ID_KEYS = ['id', 'roleid', 'role_id'];
  const ORG_ID_KEYS = ['id', 'orgid', 'org_id', 'organizationid', 'organization_id'];
  const ROLE_LABEL_KEYS = ['rolename', 'role_name', 'name', 'text', 'label', 'displayname', 'description', 'rolecode', 'code'];
  const ORG_LABEL_KEYS = ['orgname', 'org_name', 'organizationname', 'organization_name', 'name', 'text', 'label', 'displayname', 'description', 'orgcode', 'code'];
  let chatHistory = loadChatHistory();
  let zilcodeSessionId = sessionStorage.getItem(ZILCODE_SESSION_STORAGE_KEY) || '';
  let pendingRoleOrgData = null;

  function normalizeHistoryMessage(message) {
    if (!message || typeof message !== 'object') return null;
    if (message.role !== 'user' && message.role !== 'assistant') return null;
    if (typeof message.content !== 'string') return null;

    const content = message.content.trim().slice(0, MAX_HISTORY_CONTENT_CHARS);
    if (!content) return null;

    return { role: message.role, content };
  }

  function loadChatHistory() {
    try {
      const raw = sessionStorage.getItem(CHAT_HISTORY_STORAGE_KEY);
      if (!raw) return [];

      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];

      return parsed
        .map(normalizeHistoryMessage)
        .filter(Boolean)
        .slice(-MAX_HISTORY_MESSAGES);
    } catch {
      return [];
    }
  }

  function saveChatHistory() {
    try {
      sessionStorage.setItem(CHAT_HISTORY_STORAGE_KEY, JSON.stringify(chatHistory));
    } catch {
      // Ignore storage failures; chat still works without persistent session history.
    }
  }

  function rememberChatTurn(userText, assistantText) {
    const nextMessages = [
      ...chatHistory,
      { role: 'user', content: userText },
      { role: 'assistant', content: assistantText || '' }
    ];

    chatHistory = nextMessages
      .map(normalizeHistoryMessage)
      .filter(Boolean)
      .slice(-MAX_HISTORY_MESSAGES);
    saveChatHistory();
  }

  function renderStoredHistory() {
    chatHistory.forEach(message => {
      appendMessage(message.role, message.content);
    });
  }

  function getUrl() {
    return document.getElementById('workerUrl').value.replace(/\/$/, '');
  }

  function getZilcodeHeaders() {
    const headers = { 'Content-Type': 'application/json' };
    if (zilcodeSessionId) headers['X-Zilcode-Session'] = zilcodeSessionId;
    return headers;
  }

  function repairMojibakeText(value) {
    if (typeof value !== 'string') return value;
    if (!/[ÃÂÄÆâð]|á[º»]/.test(value)) return value;

    try {
      return decodeURIComponent(escape(value));
    } catch {
      return value;
    }
  }

  function setAuthStatus(text, ok = false) {
    const el = document.getElementById('authStatus');
    const safeText = repairMojibakeText(String(text));
    el.textContent = safeText;
    el.title = safeText;
    el.style.color = ok ? '#166534' : '#666';
  }

  function asList(value) {
    if (Array.isArray(value)) return value;
    if (value && typeof value === 'object') return Object.values(value);
    return [];
  }

  function getObjectValue(item, keys) {
    if (!item || typeof item !== 'object') return '';
    const entries = Object.entries(item);
    for (const key of keys) {
      const match = entries.find(([name]) => name.toLowerCase() === key.toLowerCase());
      if (match && match[1] !== undefined && match[1] !== null) return String(match[1]);
    }
    return '';
  }

  function getOptionId(item, keys) {
    return getObjectValue(item, keys);
  }

  function getOptionLabel(item, labelKeys, fallback) {
    return getObjectValue(item, labelKeys) || fallback || '-';
  }

  function formatRoleOrgStatus(data) {
    const roleName = repairMojibakeText(data.role_name || '');
    const orgName = repairMojibakeText(data.org_name || '');
    const roleLabel = roleName
      ? `${roleName} (${data.roleid || '-'})`
      : `role ${data.roleid || '-'}`;
    const orgLabel = orgName
      ? `${orgName} (${data.orgid ?? 0})`
      : `org ${data.orgid ?? 0}`;

    return `Zilcode: ${data.base_url || '-'} | ${roleLabel}, ${orgLabel}`;
  }

  function setLoggedInStatus(data) {
    setAuthStatus(formatRoleOrgStatus(data), true);
  }

  function hideRoleOrgPicker() {
    document.getElementById('roleOrgPicker').hidden = true;
    pendingRoleOrgData = null;
  }

  function fillSelect(select, items, idKeys, labelKeys, emptyOption = null) {
    select.innerHTML = '';

    if (emptyOption) {
      const option = document.createElement('option');
      option.value = emptyOption.value;
      option.textContent = emptyOption.label;
      select.appendChild(option);
    }

    items.forEach((item, index) => {
      const id = getOptionId(item, idKeys);
      if (!id) return;

      const option = document.createElement('option');
      option.value = id;
      option.textContent = getOptionLabel(item, labelKeys, `${id}`);
      option.title = option.textContent;
      if (index === 0 && !emptyOption) option.selected = true;
      select.appendChild(option);
    });
  }

  /*
    const roles = asList(data.roles);
    const orgs = asList(data.orgs);
    const defaultRole = getOptionId(roles[0], ['id', 'roleid']);
    const defaultOrg = orgs.length ? getOptionId(orgs[0], ['id', 'orgid']) : '0';

    const roleid = window.prompt('Nhập roleid Zilcode cần dùng:', defaultRole);
    if (!roleid) return;
    const orgid = window.prompt('Nhập orgid Zilcode cần dùng:', defaultOrg || '0') || '0';

    const res = await fetch(getUrl() + '/auth/select-role-org', {
      method: 'POST',
      headers: getZilcodeHeaders(),
      body: JSON.stringify({ roleid, orgid })
    });
    const selected = await res.json();
    if (!selected.success) throw new Error(selected.error || 'Không chọn được role/org');
    setAuthStatus(`Zilcode: ${selected.base_url || '-'} | role ${selected.roleid}, org ${selected.orgid}`, true);
  }

  */

  async function selectRoleOrgFromLogin(data) {
    const roles = asList(data.roles);
    const orgs = asList(data.orgs);
    const roleSelect = document.getElementById('zilRoleSelect');
    const orgSelect = document.getElementById('zilOrgSelect');

    if (roles.length === 0) {
      throw new Error('Zilcode không trả về danh sách role để chọn.');
    }

    pendingRoleOrgData = data;
    fillSelect(roleSelect, roles, ROLE_ID_KEYS, ROLE_LABEL_KEYS);
    fillSelect(orgSelect, orgs, ORG_ID_KEYS, ORG_LABEL_KEYS, {
      value: '0',
      label: 'Không chọn tổ chức'
    });

    document.getElementById('roleOrgPicker').hidden = false;
    setAuthStatus('Chọn role và organization bằng tên bên dưới, sau đó bấm Dùng role/org.');
  }

  async function confirmRoleOrgSelection() {
    const roleid = document.getElementById('zilRoleSelect').value;
    const orgid = document.getElementById('zilOrgSelect').value || '0';

    if (!roleid) {
      setAuthStatus('Chưa chọn role Zilcode.');
      return;
    }

    try {
      const res = await fetch(getUrl() + '/auth/select-role-org', {
        method: 'POST',
        headers: getZilcodeHeaders(),
        body: JSON.stringify({ roleid, orgid })
      });
      const selected = await res.json();
      if (!selected.success) throw new Error(selected.error || 'Không chọn được role/org');
      hideRoleOrgPicker();
      setLoggedInStatus(selected);
    } catch (err) {
      setAuthStatus(err.message || 'Không chọn được role/org');
    }
  }

  async function loginZilcode() {
    const zilcode_base = document.getElementById('zilBase').value.trim();
    let username = document.getElementById('zilUsername').value.trim();
    let sitecode = document.getElementById('zilSitecode').value.trim();
    const password = document.getElementById('zilPassword').value;

    if (username.includes('.') && !sitecode) {
      const parts = username.split('.');
      sitecode = parts.pop() || '';
      username = parts.join('.');
    }

    if (!username || !sitecode || !password) {
      setAuthStatus('Thiếu username/sitecode/password');
      return;
    }

    const btn = document.getElementById('zilLoginBtn');
    btn.disabled = true;
    setAuthStatus('Đang đăng nhập...');

    try {
      const res = await fetch(getUrl() + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, sitecode, password, zilcode_base })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || 'Đăng nhập thất bại');

      zilcodeSessionId = data.session_id || '';
      sessionStorage.setItem(ZILCODE_SESSION_STORAGE_KEY, zilcodeSessionId);
      document.getElementById('zilPassword').value = '';

      if (data.needs_role_org) {
        setAuthStatus('Cần chọn role/org');
        await selectRoleOrgFromLogin(data);
      } else {
        hideRoleOrgPicker();
        setLoggedInStatus(data);
      }
    } catch (err) {
      setAuthStatus(err.message || 'Lỗi đăng nhập');
    } finally {
      btn.disabled = false;
    }
  }

  async function refreshZilcodeAuth() {
    if (!zilcodeSessionId) {
      hideRoleOrgPicker();
      setAuthStatus('Chưa đăng nhập Zilcode');
      return;
    }

    try {
      const res = await fetch(getUrl() + '/auth/me', {
        method: 'GET',
        headers: getZilcodeHeaders()
      });
      const data = await res.json();
      if (!data.success) throw new Error();
      setLoggedInStatus(data);
    } catch {
      zilcodeSessionId = '';
      sessionStorage.removeItem(ZILCODE_SESSION_STORAGE_KEY);
      hideRoleOrgPicker();
      setAuthStatus('Phiên Zilcode hết hạn');
    }
  }

  async function logoutZilcode() {
    try {
      if (zilcodeSessionId) {
        await fetch(getUrl() + '/auth/logout', {
          method: 'POST',
          headers: getZilcodeHeaders()
        });
      }
    } finally {
      zilcodeSessionId = '';
      sessionStorage.removeItem(ZILCODE_SESSION_STORAGE_KEY);
      hideRoleOrgPicker();
      setAuthStatus('Chưa đăng nhập Zilcode');
    }
  }

  async function checkHealth() {
    const dot = document.getElementById('statusDot');
    dot.className = 'dot';
    try {
      const res = await fetch(getUrl() + '/');
      const data = await res.json();
      dot.className = data.success ? 'dot online' : 'dot';
    } catch {
      dot.className = 'dot';
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function send(text) {
    document.getElementById('userInput').value = text;
    sendMessage();
  }

  function now() {
    return new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
  }

  function buildDebugStepsElement(debugSteps) {
    if (!Array.isArray(debugSteps) || debugSteps.length === 0) return null;

    const details = document.createElement('details');
    details.className = 'debug-steps';

    const summary = document.createElement('summary');
    summary.textContent = `Debug flow (${debugSteps.length} bước)`;
    details.appendChild(summary);

    debugSteps.forEach((step, index) => {
      const item = document.createElement('div');
      item.className = 'debug-step';

      const title = document.createElement('div');
      title.className = 'debug-step-title';
      title.textContent = `${index + 1}. [${step.status || 'info'}] ${step.step || 'unknown_step'}`;
      item.appendChild(title);

      if (step.detail) {
        const detail = document.createElement('div');
        detail.textContent = step.detail;
        item.appendChild(detail);
      }

      if (step.data) {
        const data = document.createElement('div');
        data.className = 'debug-step-data';
        data.textContent = JSON.stringify(step.data, null, 2);
        item.appendChild(data);
      }

      details.appendChild(item);
    });

    return details;
  }

  function appendMessage(role, content, tools = [], images = [], sources = [], embeddingDebug = null, ragQueryDebug = null, debugSteps = []) {
    const empty = document.getElementById('emptyState');
    if (empty) empty.remove();

    const container = document.getElementById('messages');
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    if (role === 'assistant' && tools.length > 0) {
      tools.forEach(tool => {
        const meta = TOOL_META[tool] || { label: tool, icon: '🔧', cls: '' };
        const badge = document.createElement('div');
        badge.className = `tool-badge ${meta.cls}`;
        badge.innerHTML = `<span class="icon">${meta.icon}</span>${meta.label}`;
        msg.appendChild(badge);
      });
    }

    if (content) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = content;
      msg.appendChild(bubble);
    }

    if (role === 'assistant' && Array.isArray(images)) {
      images.forEach(image => {
        if (!image || !image.data_url) return;
        const img = document.createElement('img');
        img.className = 'generated-image';
        img.src = image.data_url;
        img.alt = image.prompt || 'Generated chart';
        msg.appendChild(img);
      });
    }

    if (role === 'assistant' && Array.isArray(sources) && sources.length > 0) {
      const sourceList = document.createElement('div');
      sourceList.className = 'sources';
      sources.forEach(source => {
        const item = document.createElement('div');
        item.className = 'source-item';

        const title = document.createElement('strong');
        title.textContent = source.title || source.module || source.id;
        item.appendChild(title);

        const meta = document.createElement('div');
        meta.className = 'source-meta';
        const score = typeof source.vector_score === 'number'
          ? `score ${source.vector_score.toFixed(3)}`
          : 'score n/a';
        const rank = source.rerank_rank ? `rank ${source.rerank_rank}` : 'rank n/a';
        meta.textContent = [source.section_path || source.heading, score, rank]
          .filter(Boolean)
          .join(' · ');
        item.appendChild(meta);

        sourceList.appendChild(item);
      });
      msg.appendChild(sourceList);
    }

    if (role === 'assistant' && ragQueryDebug) {
      const debug = document.createElement('div');
      debug.className = 'debug-log';

      const mode = ragQueryDebug.used ? 'rewritten' : 'original';
      const label = document.createElement('strong');
      label.textContent = 'RAG query';
      debug.appendChild(label);
      debug.appendChild(document.createTextNode(`: ${mode} | ${ragQueryDebug.rewritten_query || ragQueryDebug.original_query || 'unknown query'}`));

      if (ragQueryDebug.used && ragQueryDebug.original_query) {
        debug.appendChild(document.createElement('br'));
        debug.appendChild(document.createTextNode(`Original: ${ragQueryDebug.original_query}`));
      }

      msg.appendChild(debug);
    }

    if (role === 'assistant' && embeddingDebug) {
      const debug = document.createElement('div');
      debug.className = 'debug-log';

      const provider = embeddingDebug.provider === 'openrouter' ? 'OpenRouter' : 'Cloudflare';
      const model = embeddingDebug.model || 'unknown model';
      const dimensions = typeof embeddingDebug.dimensions === 'number'
        ? `${embeddingDebug.dimensions} chiều`
        : 'không rõ số chiều';
      const mode = embeddingDebug.fallback ? 'fallback' : 'primary';

      const label = document.createElement('strong');
      label.textContent = 'Embedding user message';
      debug.appendChild(label);
      debug.appendChild(document.createTextNode(`: ${provider} | ${model} | ${dimensions} | ${mode}`));
      msg.appendChild(debug);
    }

    const debugStepsElement = buildDebugStepsElement(debugSteps);
    if (role === 'assistant' && debugStepsElement) {
      msg.appendChild(debugStepsElement);
    }

    const ts = document.createElement('div');
    ts.className = 'timestamp';
    ts.textContent = now();
    msg.appendChild(ts);

    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
    return msg;
  }

  function appendTyping() {
    const empty = document.getElementById('emptyState');
    if (empty) empty.remove();

    const container = document.getElementById('messages');
    const msg = document.createElement('div');
    msg.className = 'msg assistant';
    msg.id = 'typing-indicator';

    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    msg.appendChild(typing);

    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    appendMessage('user', text);
    appendTyping();

    try {
      const res = await fetch(getUrl() + '/chat', {
        method: 'POST',
        headers: getZilcodeHeaders(),
        body: JSON.stringify({
          message: text,
          history: chatHistory.slice(-MAX_HISTORY_MESSAGES),
          debug: true
        })
      });

      removeTyping();

      const data = await res.json();

      if (data.success) {
        const assistantText = data.response || '';
        appendMessage(
          'assistant',
          assistantText,
          data.tools_called || [],
          data.images || [],
          data.sources || [],
          data.embedding_debug || null,
          data.rag_query_debug || null,
          data.debug_steps || []
        );
        rememberChatTurn(text, assistantText);
      } else {
        const msg = document.createElement('div');
        msg.className = 'msg assistant';
        const err = document.createElement('div');
        err.className = 'error-bubble';
        err.textContent = '❌ ' + (data.error || 'Unknown error');
        msg.appendChild(err);

        const debugStepsElement = buildDebugStepsElement(data.debug_steps || []);
        if (debugStepsElement) msg.appendChild(debugStepsElement);

        document.getElementById('messages').appendChild(msg);
      }

    } catch (err) {
      removeTyping();
      const container = document.getElementById('messages');
      const msg = document.createElement('div');
      msg.className = 'msg assistant';
      const errEl = document.createElement('div');
      errEl.className = 'error-bubble';
      errEl.textContent = '❌ Không kết nối được Worker. Kiểm tra URL và CORS.';
      msg.appendChild(errEl);
      container.appendChild(msg);
    }

    btn.disabled = false;
    input.focus();
  }

  renderStoredHistory();
  checkHealth();
  refreshZilcodeAuth();
</script>
</body>
</html>
