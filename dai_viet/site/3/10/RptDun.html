<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
            /* background-color: #fff; */
            margin: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header img {
            width: 120px;
            float: left;
        }

        .header h1 {
            font-size: 20px;
            margin: 0;
        }

        .header h2 {
            font-size: 18px;
            margin: 4px 0;
        }

        /* .header .meta {
            text-align: right;
            font-size: 13px;
            font-style: italic;
        } */

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid #000;
            padding: 5px;
            text-align: center;
        }

        /* th {
            background: #f0f0f0;
        } */

        td[colspan] {
            text-align: left;
        }

        .sign-col {
            padding: 0 !important;
        }

        .sign-wrap {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sign-title {
            border-bottom: 1px solid #000;
            padding: 5px;
            font-weight: bold;
        }

        .sign-body {
            display: flex;
            height: 100%;
        }

        .sign-name {
            width: 70%;
            border-right: 1px solid #000;
            padding: 5px;
        }

        .sign-ksc {
            width: 30%;
            padding: 5px;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="logo.png" alt="Logo">
        <h1>THỐNG KÊ SỐ LƯỢNG TẤM SAU ĐÙN</h1>
        <!-- <div class="meta">
            <p>Mã Tài liệu: D-01</p>
            <p>Xem xét/ ban hành: 11/05/2023</p>
            <p>Trang số: .......</p>
        </div> -->
    </div>
    <a style="float:right;border:1px solid;padding:6px 10px 6px 10px" download="RptIn.xls"
        onclick="if(!this.href)this.href='data:application/vnd.ms-excel,'+document.body.innerHTML.replace(/ /g, '%20')">Kết
        xuất Excel</a>

    <table id="tblData" border="1">
        <tr>
            <td colspan="3">NGÀY: </td>
            <td colspan="3">CA SẢN XUẤT: </td>
            <td colspan="3">TỔ MÁY: </td>
            <!-- <td colspan="4">TÊN TỔ TRƯỞNG:</td> -->
        </tr>
        <tr>
            <th>STT</th>
            <th>Số máy</th>
            <th>Mã hàng</th>
            <th>Số lượng tấm lót</th>
            <th>Biển số xe</th>
            <th>Số seri tem</th>
            <th>Số tấm</th>
            <th>KL hàng<br>thực tế<br>(1-2)</th>
            <th>KL hàng<br>theo định mức<br>(4)</th>
            <th>Phế theo máy<br>(kg)</th>
            <th>Nguyên nhân</th>
            <th class="sign-col">
                <div class="sign-wrap">
                    <div class="sign-title">
                        Ghi chú/xác nhận
                    </div>
                    <div class="sign-body">
                        <div class="sign-name">Phế đầu máy(kg)</div>
                        <div class="sign-ksc">Hạt cưa(kg)</div>
                    </div>
                </div>
            </th>

        </tr>
    </table>
</body>

</html>
