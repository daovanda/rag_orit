<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
            background-color: #fff;
            margin: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header img {
            width: 120px;
            float: left;
        }

        .header h1 {
            font-size: 20px;
            margin: 0;
        }

        .header h2 {
            font-size: 18px;
            margin: 4px 0;
        }

        /* .header .meta {
            text-align: right;
            font-size: 13px;
            font-style: italic;
        } */

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid #000;
            padding: 5px;
            text-align: center;
        }

        /* th {
            background: #f0f0f0;
        } */

        td[colspan] {
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="logo.png" alt="Logo">
        <h1>CÔNG TY TNHH SẢN XUẤT THƯƠNG MẠI NHỰA ĐẠI VIỆT</h1>
        <h2>SỔ THÀNH PHẨM ĐÓNG GÓI</h2>
        <!-- <div class="meta">
            <p>Mã tài liệu: DG-01</p>
            <p>Xem xét/ban hành: .......</p>
            <p>Trang số: .......</p>
        </div> -->
    </div>

    <a style="float:right;border:1px solid;padding:6px 10px 6px 10px" download="RptIn.xls"
        onclick="if(!this.href)this.href='data:application/vnd.ms-excel,'+document.body.innerHTML.replace(/ /g, '%20')">Kết
        xuất Excel</a>

    <table id="tblData" border="1">
        <tr>
            <td colspan="2">Ngày:</td>

            <td colspan="2">Ca:</td>

            <td colspan="4">Tổ trưởng:</td>

            <!-- <td colspan="2"></td> -->
            <!-- <td></td> -->

        </tr>

        <tr>
            <th rowspan="2">STT</th>
            <th rowspan="2">Mã hàng</th>
            <th rowspan="2">Số Seri</th>
            <th rowspan="2">Số tấm / Số kiện</th>
            <th colspan="2">Thêm / Thiếu</th>
            <th rowspan="2">Lỗi</th>
            <th rowspan="2">Ghi chú</th>
        </tr>

        <tr>
            <th>(+)</th>
            <th>(-)</th>
        </tr>
    </table>
</body>

</html>
