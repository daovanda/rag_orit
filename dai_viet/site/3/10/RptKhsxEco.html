<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>BÁO CÁO KHSX ECO</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 10px;
        }

        h2 {
            margin: 6px 0 10px;
            text-align: center;
            font-size: 18px;
        }

        .toolbar {
            margin-bottom: 8px;
            text-align: right;
        }

        .btn {
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #999;
            background: #f2f2f2;
        }

        .btn:hover {
            background: #e6e6e6;
        }

        .table-wrapper {
            overflow-x: auto;
            border: 1px solid #ccc;
            max-width: 100%;
        }

        table {
            border-collapse: collapse;
            min-width: 2200px;
            font-size: 12px;
        }

        th, td {
            border: 1px solid #999;
            padding: 4px 6px;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background: #f2f2f2;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        /* ===== CỐ ĐỊNH 3 CỘT ĐẦU ===== */
        th:nth-child(1), td:nth-child(1) {
            position: sticky;
            left: 0;
            width: 50px;
            background: #fff;
            z-index: 3;
        }

        th:nth-child(2), td:nth-child(2) {
            position: sticky;
            left: 50px;
            width: 100px;
            background: #fff;
            z-index: 3;
        }

        th:nth-child(3), td:nth-child(3) {
            position: sticky;
            left: 150px;
            width: 120px;
            background: #fff;
            z-index: 3;
        }
    </style>
</head>

<body>

    <h2 id="title">BÁO CÁO KẾ HOẠCH SẢN XUẤT ECO</h2>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <button class="btn" onclick="exportExcel()">📥 Xuất Excel</button>
    </div>

    <div class="table-wrapper">
        <table id="tblReport">
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Ngày</th>
                    <th>Máy</th>
                    <th>Mã SP</th>
                    <th>Quy cách</th>
                    <th>Màu</th>

                    <th>Tổng SL</th>
                    <th>Tổng KL</th>

                    <th>SL đùn</th>
                    <th>KL đùn</th>

                    <th>SL còn</th>
                    <th>KL còn</th>

                    <th>SL mang in</th>
                    <th>SL in đạt</th>
                    <th>SL chưa in</th>

                    <th>Đóng gói</th>
                    <th>Chưa đóng</th>

                    <th>Kiện tồn</th>
                    <th>Tồn phôi</th>
                    <th>Số ngày còn</th>
                </tr>
            </thead>

            <tbody id="tblData">

            </tbody>
        </table>
    </div>

   <script>
function exportExcel() {

    var table = document.getElementById("tblReport");

    var excelTable = "<table border='1' style='border-collapse:collapse;font-family:Arial;font-size:12px;'>";

    // HEADER
    excelTable += "<tr>";
    for (var i = 0; i < table.rows[0].cells.length; i++) {
        excelTable += "<th style='background:#D9D9D9;padding:4px;text-align:center;font-weight:bold;'>"
            + table.rows[0].cells[i].innerText +
            "</th>";
    }
    excelTable += "</tr>";

    // BODY
    for (var r = 1; r < table.rows.length; r++) {
        excelTable += "<tr>";
        for (var c = 0; c < table.rows[r].cells.length; c++) {
            excelTable += "<td style='padding:4px;text-align:center;'>"
                + table.rows[r].cells[c].innerText +
                "</td>";
        }
        excelTable += "</tr>";
    }

    excelTable += "</table>";

    var html = `
        <html>
        <head>
            <meta charset="UTF-8">
        </head>
        <body>
            <h3>BÁO CÁO KHSX ECO</h3>
            ${excelTable}
        </body>
        </html>
    `;

    var blob = new Blob(
        ['\ufeff' + html],
        { type: 'application/vnd.ms-excel;charset=utf-8;' }
    );

    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "Bao_cao_KHSX_ECO.xls";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
</script>


</body>
</html>
